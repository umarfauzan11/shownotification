<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@bmdu_studio/shnjs Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f11;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
      box-sizing: border-box;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin-top: 0;
      font-size: 24px;
      font-weight: 700;
      color: #fafafa;
    }
    p {
      color: #a1a1aa;
      font-size: 14px;
      line-height: 1.5;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }
    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-default { background: #27272a; color: #fff; }
    .btn-default:hover { background: #3f3f46; }
    .btn-success { background: #14532d; color: #4ade80; border-color: #22c55e44; }
    .btn-success:hover { background: #166534; }
    .btn-error { background: #7f1d1d; color: #f87171; border-color: #ef444444; }
    .btn-error:hover { background: #991b1b; }
    .btn-warning { background: #78350f; color: #fbbf24; border-color: #f59e0b44; }
    .btn-warning:hover { background: #92400e; }
    .btn-info { background: #1e3a8a; color: #60a5fa; border-color: #3b82f644; }
    .btn-info:hover { background: #1e40af; }
    .btn-clear { grid-column: span 2; background: #27272a; color: #a1a1aa; }
    .btn-clear:hover { background: #3f3f46; color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 @bmdu_studio/shnjs</h1>
    <p>Elegant, zero-dependency notification system. Click any button below to trigger notifications:</p>

    <div class="btn-grid">
      <button class="btn-default" onclick="shn('Basic notification message')">Default / Alert</button>
      <button class="btn-info" onclick="shn.info('This is an info notification')">Info</button>
      <button class="btn-success" onclick="shn.success('Data saved successfully!')">Success</button>
      <button class="btn-warning" onclick="shn.warning('Please check your network')">Warning</button>
      <button class="btn-error" onclick="shn.error('Failed to submit the form')">Error</button>
      <button class="btn-default" onclick="shn('Top Right Toast', { position: 'top-right' })">Top-Right</button>
      <button class="btn-clear" onclick="shn.dismissAll()">Dismiss All</button>
    </div>
  </div>

  <script src="./dist/index.global.js"></script>
</body>
</html>
